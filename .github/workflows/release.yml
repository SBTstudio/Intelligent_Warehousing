name: release-packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  windows-exe:
    name: Windows x64 exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build one-file exe
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SmartWMS --icon assets/icon.ico --add-data "data/sample;data/sample" --add-data "assets;assets" --hidden-import matplotlib.backends.backend_qtagg --hidden-import PySide6.QtSvg --exclude-module pandas --exclude-module tkinter main.py

      - name: Rename artifact
        run: Move-Item -Force dist/SmartWMS.exe dist/SmartWMS-Windows-x64.exe

      - name: Show result
        run: dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: SmartWMS-Windows-x64
          path: dist/SmartWMS-Windows-x64.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS arm64 dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build .app
        run: |
          python -m PyInstaller --noconfirm --clean packaging/SmartWMS.spec
          codesign --force --deep --sign - dist/SmartWMS.app || true

      - name: Build dmg
        run: |
          rm -rf dist/dmg
          mkdir -p dist/dmg
          cp -R dist/SmartWMS.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "SmartWMS" -srcfolder dist/dmg -ov -format UDZO dist/SmartWMS-macOS-arm64.dmg
          hdiutil verify dist/SmartWMS-macOS-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SmartWMS-macOS-arm64
          path: dist/SmartWMS-macOS-arm64.dmg
          if-no-files-found: error

  publish:
    name: Upload assets to Release
    runs-on: ubuntu-latest
    needs: [windows-exe, macos-dmg]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "v1.0.2 — 第三方 API + Windows / macOS 安装包"
          body_path: docs/RELEASE_v1.0.2.md
          files: |
            artifacts/SmartWMS-Windows-x64.exe
            artifacts/SmartWMS-macOS-arm64.dmg
          fail_on_unmatched_files: true
          make_latest: true

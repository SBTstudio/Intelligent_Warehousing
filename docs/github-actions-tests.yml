# CI 模板：复制到 .github/workflows/tests.yml 后提交。
# 推送带 workflow 文件的提交需要 OAuth token 具备 workflow scope。

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: ${{ github.workspace }}/.mplcache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q app main.py tools tests

      - name: Run tests
        run: pytest -q
